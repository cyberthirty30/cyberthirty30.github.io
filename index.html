<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber30 :: Professional Portfolio</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="asset/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="asset/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="asset/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="asset/favicon/apple-touch-icon.png">
    <link rel="manifest" href="asset/favicon/site.webmanifest">
    
    <!-- Android -->
    <link rel="icon" type="image/png" sizes="192x192" href="asset/favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="asset/favicon/android-chrome-512x512.png">
    
    <!-- Google Font: Inter for UI & VT323 for Hacker feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=VT323&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS, React & Babel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-bg': '#05070a', // Deep midnight
                        'cyber-card': '#0d1117', // Github-like dark slate
                        'cyber-accent': '#10b981', // Emerald 500
                        'cyber-ruby': '#f43f5e', // Rose 500
                        'cyber-text': '#e2e8f0', // Soft white
                        'cyber-dim': '#94a3b8', // Slate 400
                    },
                    fontFamily: {
                        'hacker': ['VT323', 'monospace'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'scan': 'scan 8s linear infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)', opacity: 0 },
                            '50%': { opacity: 0.05 },
                            '100%': { transform: 'translateY(100%)', opacity: 0 },
                        },
                        glow: {
                            'from': { 'box-shadow': '0 0 5px rgba(16, 185, 129, 0.2)' },
                            'to': { 'box-shadow': '0 0 20px rgba(16, 185, 129, 0.4)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #05070a;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        /* Grain effect */
        .grain::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.03;
            pointer-events: none;
            z-index: 50;
        }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #05070a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    </style>
</head>
<body class="grain font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const resumeData = {
            security: ['Penetration Testing'],
            creative: ['Audio Engineering (Pro Tools)', '3D Modeling (Blender)', 'JUCE Framework', 'UI/UX Design'],
            systems: ['Kali & Parrot OS', 'Docker / Kubernetes', 'Virtualization', 'Cloud Security']
        };

        const ConsolePrompt = ({ title, colorClass = "text-cyber-accent" }) => (
            <div className="flex items-center gap-2 mb-4 border-b border-white/5 pb-2">
                <div className="flex gap-1.5">
                    <div className="w-2.5 h-2.5 rounded-full bg-cyber-ruby/40"></div>
                    <div className="w-2.5 h-2.5 rounded-full bg-yellow-500/40"></div>
                    <div className="w-2.5 h-2.5 rounded-full bg-cyber-accent/40"></div>
                </div>
                <h2 className={`font-hacker text-xl tracking-tight ${colorClass}`}>
                    ~/docs/<span className="text-cyber-text">{title.toLowerCase()}</span>
                </h2>
            </div>
        );

        const GlassCard = ({ children, className = "" }) => (
            <div className={`bg-cyber-card/50 backdrop-blur-md border border-white/10 rounded-xl p-6 transition-all duration-500 hover:border-cyber-accent/30 group ${className}`}>
                {children}
            </div>
        );

        const FakeTerminal = () => {
            const [history, setHistory] = useState([{ type: 'output', text: 'Initialize system kernel... [OK]\nEstablish secure connection... [OK]\nWelcome, authorized user.' }]);
            const [inputValue, setInputValue] = useState('');
            const terminalEndRef = useRef(null);

            const commands = {
                'help': 'Display available protocols',
                'whoami': 'Identity',
                'status': 'System: Optimal | Mood: Creative',
                'clear': 'Flush terminal buffer',
                'ls': 'Lists files and directories in the current path',
                'hostname': 'Shows the network name of the system',
                'cat': 'Outputs the content of specified files (use "cat [filename]")'
            };

            const handleCommand = (e) => {
                if (e.key === 'Enter') {
                    const cmd = inputValue.toLowerCase().trim();
                    let response = `Command '${cmd}' not recognized. Type 'help' for options.`;
                    
                    if (cmd === 'clear') { 
                        setHistory([]); 
                        setInputValue(''); 
                        return; 
                    }
                    
                    if (cmd === 'help') response = Object.entries(commands).map(([k,v]) => `${k.padEnd(10)} - ${v}`).join('\n');
                    else if (cmd === 'whoami') response = "LUCKY NGABU :: SECURITY ARCHITECT & PRODUCER";
                    else if (cmd === 'status') response = "CPU: 12% | RAM: 4.2GB | UPTIME: 320 DAYS";
                    else if (cmd === 'ls') response = "game.txt   root.txt   king.txt   flag.txt";
                    else if (['hostname', 'cat king.txt', 'cat root.txt', 'cat flag.txt', 'cat game.txt'].includes(cmd)) response = "cyber30";

                    setHistory(prev => [...prev, { type: 'input', text: inputValue }, { type: 'output', text: response }]);
                    setInputValue('');
                }
            };

            useEffect(() => {
                if (terminalEndRef.current) {
                    terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [history]);

            return (
                <div className="bg-[#020408] rounded-b-lg p-4 font-hacker text-lg border-t border-white/5 shadow-2xl h-64 overflow-y-auto">
                    {history.map((h, i) => (
                        <div key={i} className={h.type === 'input' ? "text-cyber-dim" : "text-cyber-accent mb-1 whitespace-pre-wrap"}>
                            {h.type === 'input' && <span className="text-cyber-ruby mr-2">❯</span>}
                            {h.text}
                        </div>
                    ))}
                    <div className="flex items-center">
                        <span className="text-cyber-ruby mr-2">❯</span>
                        <input 
                            className="bg-transparent border-none outline-none text-cyber-text w-full" 
                            autoFocus 
                            onKeyDown={handleCommand}
                            value={inputValue}
                            onChange={(e) => setInputValue(e.target.value)}
                        />
                    </div>
                    <div ref={terminalEndRef} />
                </div>
            );
        };

        const App = () => {
            return (
                <div className="relative min-h-screen pb-20">
                    {/* Effects */}
                    <div className="fixed inset-0 crt-overlay pointer-events-none z-50"></div>
                    <div className="fixed top-0 left-0 w-full h-1 bg-cyber-accent/20 animate-scan z-50"></div>

                    <div className="container mx-auto px-6 pt-12 max-w-5xl">
                        {/* Header */}
                        <header className="flex flex-col items-center text-center mb-16">
                            <h1 className="text-6xl font-hacker tracking-tighter text-cyber-text mb-2">
                                CYBER<span className="text-cyber-ruby">30</span>
                            </h1>

                            <div className="flex flex-wrap items-center justify-center gap-4">
                                <a 
                                    href="#" 
                                    className="px-8 py-3 bg-white/5 border border-white/10 rounded-full hover:bg-cyber-accent/10 hover:border-cyber-accent/50 transition-all text-sm font-semibold tracking-widest text-cyber-accent uppercase"
                                >
                                    View Full Intelligence Report (CV)
                                </a>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                            {/* Left Column */}
                            <div className="md:col-span-7 space-y-6">
                                <GlassCard>
                                    <ConsolePrompt title="identity.sh" />
                                    <p className="text-cyber-dim mb-4 leading-relaxed">
                                        Independent security researcher and software architect focused on low-level exploitation and creative tool development.
                                    </p>
                                    <div className="flex flex-wrap gap-3">
                                        {['pwn', 'web', 'reversing', 'mastering'].map(tag => (
                                            <span key={tag} className="text-[10px] uppercase tracking-widest px-2 py-1 bg-cyber-accent/10 text-cyber-accent rounded-md border border-cyber-accent/20">
                                                #{tag}
                                            </span>
                                        ))}
                                    </div>
                                </GlassCard>

                                <GlassCard>
                                    <ConsolePrompt title="repositories.git" colorClass="text-cyber-accent" />
                                    <div className="space-y-4">
                                        <a href="https://github.com/cyberthirty30/TryHackMe-Room-Tools" target="_blank" rel="noopener noreferrer" className="block p-4 rounded-lg bg-black/20 border border-white/5 hover:border-cyber-accent/50 transition-all group">
                                            <div className="flex items-center justify-between mb-2">
                                                <h3 className="font-hacker text-xl text-cyber-text group-hover:text-cyber-accent transition-colors">TryHackMe-Room-Tools</h3>
                                                <svg className="w-4 h-4 text-cyber-dim group-hover:text-cyber-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                                            </div>
                                            <p className="text-sm text-cyber-dim">Custom scripts, automation, and tools developed for completing various TryHackMe rooms.</p>
                                        </a>

                                        <a href="https://github.com/cyberthirty30/Pychattr" target="_blank" rel="noopener noreferrer" className="block p-4 rounded-lg bg-black/20 border border-white/5 hover:border-cyber-ruby/50 transition-all group">
                                            <div className="flex items-center justify-between mb-2">
                                                <h3 className="font-hacker text-xl text-cyber-text group-hover:text-cyber-ruby transition-colors">Pychattr</h3>
                                                <svg className="w-4 h-4 text-cyber-dim group-hover:text-cyber-ruby transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                                            </div>
                                            <p className="text-sm text-cyber-dim">Python-based chat application and communication tool.</p>
                                        </a>
                                    </div>
                                </GlassCard>

                                <GlassCard className="!p-0 overflow-hidden">
                                    <div className="p-6 pb-0">
                                        <ConsolePrompt title="terminal.exe" colorClass="text-cyber-ruby" />
                                    </div>
                                    <FakeTerminal />
                                </GlassCard>
                            </div>

                            {/* Right Column */}
                            <div className="md:col-span-5 space-y-6">
                                <GlassCard>
                                    <ConsolePrompt title="technical_stack.json" />
                                    <div className="grid grid-cols-2 gap-8">
                                        <div>
                                            <h4 className="text-xs uppercase tracking-tighter text-cyber-ruby mb-3">Security</h4>
                                            <ul className="space-y-2 text-cyber-dim font-hacker text-lg">
                                                {resumeData.security.slice(0,4).map(s => <li key={s}>• {s}</li>)}
                                            </ul>
                                        </div>
                                    </div>
                                </GlassCard>
                                
                                <GlassCard>
                                    <ConsolePrompt title="achievements.log" colorClass="text-yellow-500" />
                                    <div className="space-y-4">
                                      <div className="flex items-center justify-between p-4 rounded-lg bg-black/20 border border-white/5 backdrop-blur-sm">
                                        <div className="flex flex-col gap-1">
                                          <span className="text-xs uppercase tracking-widest text-cyber-dim">TryHackMe Rank</span>
                                          <span className="text-cyber-accent font-hacker text-xl font-bold">TOP 1%</span>
                                        </div>
                                        <a href="https://tryhackme.com/p/cyber30" target="_blank" rel="noopener noreferrer" className="shrink-0 hover:scale-105 transition-all">
                                          <img src="https://tryhackme-badges.s3.amazonaws.com/cyber30.png" alt="THM" className="h-12 w-auto rounded border border-white/10" />
                                        </a>
                                      </div>

                                      <div className="flex items-center justify-between p-4 rounded-lg bg-black/20 border border-white/5 backdrop-blur-sm">
                                        <div className="flex flex-col gap-1">
                                          <span className="text-xs uppercase tracking-widest text-cyber-dim">HackTheBox</span>
                                          <span className="text-cyber-ruby font-hacker text-xl font-bold uppercase">Noob</span>
                                        </div>
                                        <a href="https://app.hackthebox.com/profile/1751803" target="_blank" rel="noopener noreferrer" className="shrink-0 hover:scale-105 transition-all">
                                          <img src="https://www.hackthebox.com/badge/image/1751803" alt="HTB" className="h-12 w-auto rounded border border-white/10" />
                                        </a>
                                      </div>
                                    </div>
                                </GlassCard>

                                <GlassCard>
                                    <ConsolePrompt title="audio_creative.dll" />
                                    <div className="flex items-center gap-4 mb-4">
                                        <div className="p-3 bg-cyber-ruby/10 rounded-lg text-cyber-ruby">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
                                        </div>
                                        <div>
                                            <h4 className="text-cyber-text font-semibold text-sm">Signal Processing</h4>
                                            <p className="text-xs text-cyber-dim">VST/AU Development & Audio Engineering</p>
                                        </div>
                                    </div>
                                    <div className="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                                        <div className="h-full bg-cyber-accent w-4/5 animate-pulse-slow"></div>
                                    </div>
                                </GlassCard>

                                <div className="grid grid-cols-2 gap-4">
                                    <a href="https://x.com/ybksniper" target="_blank" className="flex items-center justify-center p-4 rounded-xl bg-cyber-card border border-white/5 hover:border-cyber-accent/50 transition-all group">
                                        <span className="font-hacker text-cyber-dim group-hover:text-cyber-accent transition-colors">TWITTER</span>
                                    </a>
                                    <a href="https://instagram.com/ybksniper" target="_blank" className="flex items-center justify-center p-4 rounded-xl bg-cyber-card border border-white/5 hover:border-cyber-ruby/50 transition-all group">
                                        <span className="font-hacker text-cyber-dim group-hover:text-cyber-ruby transition-colors">INSTAGRAM</span>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <footer className="mt-20 pt-8 border-t border-white/5 text-center">
                            <p className="text-[10px] uppercase tracking-[0.4em] text-cyber-dim/50">
                                © 2026 CYBER30 CORE // ENCRYPTED SESSION
                            </p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
